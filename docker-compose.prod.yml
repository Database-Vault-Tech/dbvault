# DBVault — production overlay for a single VPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The base file builds the images from source; this overlay replaces the
# build with images pulled from a registry (Docker Hub by default), so the
# server never needs the source tree or a compiler. It is what
# .github/workflows/deploy.yml ships and runs.
#
# Requires Docker Compose v2.24+ (for `!reset`).

services:
  api:
    build: !reset null
    image: ${DBVAULT_IMAGE_BACKEND:-dbvault/dbvault-backend}:${DBVAULT_IMAGE_TAG:-latest}
    pull_policy: always

  worker:
    image: ${DBVAULT_IMAGE_BACKEND:-dbvault/dbvault-backend}:${DBVAULT_IMAGE_TAG:-latest}
    pull_policy: always

  scheduler:
    image: ${DBVAULT_IMAGE_BACKEND:-dbvault/dbvault-backend}:${DBVAULT_IMAGE_TAG:-latest}
    pull_policy: always

  frontend:
    build: !reset null
    image: ${DBVAULT_IMAGE_FRONTEND:-dbvault/dbvault-frontend}:${DBVAULT_IMAGE_TAG:-latest}
    pull_policy: always
    # Behind a reverse proxy (Caddy, nginx, Traefik) terminating TLS, set
    # APP_BIND=127.0.0.1 in .env so the app is not reachable directly.
    ports: !override
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
