# Builds the backend and frontend images, pushes them to Docker Hub, then
# rolls the compose stack over on the VPS via SSH.
#
# Secrets and variables are listed in docs/deployment.md. Note that
# DOCKERHUB_USERNAME is a *variable*, not a secret: it forms part of the image
# name, and GitHub blanks out anything containing a secret when it crosses
# between jobs.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: "Existing image tag to redeploy, e.g. a previous commit SHA (skips the build)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image }}
    if: ${{ !inputs.deploy_tag }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          test -n "$NAMESPACE" ||
            { echo "::error::Set the DOCKERHUB_USERNAME repository variable."; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          # Set DEPLOY_PLATFORMS to linux/arm64 for an Ampere/Graviton VPS.
          platforms: ${{ vars.DEPLOY_PLATFORMS || 'linux/amd64' }}
          push: true
          provenance: false
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/dbvault-${{ matrix.image }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/dbvault-${{ matrix.image }}:latest
          build-args: |
            VERSION=${{ github.sha }}
            SITE_URL=${{ vars.SITE_URL || 'https://dbvault.tech' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Roll out to VPS
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      # The deploy always pins an immutable tag, never `latest`.
      TAG: ${{ inputs.deploy_tag || github.sha }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/dbvault' }}
      SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -yqq sshpass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; trusting the host key on sight."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          # ControlMaster reuses one authenticated connection for every step
          # below, so a deploy logs in once rather than once per command.
          cat > ~/.ssh/config <<EOF
          Host dbvault
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            PreferredAuthentications password,keyboard-interactive
            PubkeyAuthentication no
            ControlMaster auto
            ControlPath ~/.ssh/cm
            ControlPersist 10m
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/known_hosts ~/.ssh/config

      - name: Deploy
        env:
          ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          tar czf - docker-compose.yml docker-compose.prod.yml docker/ |
            sshpass -e ssh dbvault "mkdir -p '$DEPLOY_PATH' && tar xzf - -C '$DEPLOY_PATH'"
          # Written mode 600 (it holds ENCRYPTION_KEY) and moved into place
          # atomically, so a dropped connection can't leave a truncated .env.
          printf '%s\n' "$ENV_FILE" | sshpass -e ssh dbvault \
            "umask 077 && cat > '$DEPLOY_PATH/.env.tmp' && mv '$DEPLOY_PATH/.env.tmp' '$DEPLOY_PATH/.env'"
          sshpass -e ssh dbvault "DEPLOY_PATH='$DEPLOY_PATH' \
            DBVAULT_IMAGE_BACKEND='$NAMESPACE/dbvault-backend' \
            DBVAULT_IMAGE_FRONTEND='$NAMESPACE/dbvault-frontend' \
            DBVAULT_IMAGE_TAG='$TAG' \
            bash -s" < scripts/deploy-remote.sh

      - name: Smoke test
        if: ${{ vars.APP_URL != '' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$APP_URL/api/health"

      - name: Close the SSH connection
        if: always()
        run: ssh -O exit dbvault 2>/dev/null || true
