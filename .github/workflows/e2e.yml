name: End-to-end

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Full stack (docker compose + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: ./scripts/setup.sh
      - name: Start DBVault with a sample database
        run: docker compose -f docker-compose.yml -f docker/e2e.yml up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run end-to-end flow
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e
      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker/e2e.yml logs --no-color api worker scheduler frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
